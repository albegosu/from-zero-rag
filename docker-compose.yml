services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hypar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hypar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hypar_password}
      POSTGRES_DB: ${POSTGRES_DB:-hypar_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hypar} -d ${POSTGRES_DB:-hypar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hypar-network
    profiles: ["full", "api", "all"]

  # Ollama for the agent collaborator
  ollama:
    image: ollama/ollama:latest
    container_name: hypar-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull the chat model on startup
    entrypoint: >
      sh -c "
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull ${OLLAMA_LLM_MODEL:-llama3.1:8b}
        tail -f /dev/null
      "
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    networks:
      - hypar-network
    profiles: ["full", "api", "all"]

  # hypar app
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hypar-app
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hypar}:${POSTGRES_PASSWORD:-hypar_password}@postgres:5432/${POSTGRES_DB:-hypar_db}
      NUXT_DATABASE_URL: postgresql://${POSTGRES_USER:-hypar}:${POSTGRES_PASSWORD:-hypar_password}@postgres:5432/${POSTGRES_DB:-hypar_db}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      NUXT_OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b}
      NUXT_OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b}
      OLLAMA_CHAT_TIMEOUT_MS: ${OLLAMA_CHAT_TIMEOUT_MS:-180000}
      NUXT_OLLAMA_CHAT_TIMEOUT_MS: ${OLLAMA_CHAT_TIMEOUT_MS:-180000}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      NUXT_OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      NUXT_LLM_PROVIDER: ${LLM_PROVIDER:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-${AUTH_SECRET:-insecure-dev-docker-change-me}}
      AUTH_SECRET: ${AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hypar-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    profiles: ["full", "all"]

  # pgAdmin for visual database management
  pgadmin:
    image: dpage/pgadmin4
    container_name: hypar-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - hypar-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full", "all"]

volumes:
  postgres_data:
  ollama_data:

networks:
  hypar-network:
    driver: bridge
